name: Import Vali Admin

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-vali-admin
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out importer workflow
        uses: actions/checkout@v4

      - name: Download upstream source archive
        run: |
          mkdir upstream
          curl -L --fail --retry 3 https://codeload.github.com/pratikborsadiya/vali-admin/tar.gz/refs/heads/master | tar -xz --strip-components=1 -C upstream

      - name: Preserve importer and add attribution
        run: |
          mkdir -p upstream/.github/workflows
          find upstream/.github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -delete
          cp .github/workflows/import-vali-admin.yml upstream/.github/workflows/import-vali-admin.yml
          cat >> upstream/README.md <<'EOF'

          ---

          ## Amin4601 portfolio mirror

          This repository contains an imported source snapshot of [Vali Admin](https://github.com/pratikborsadiya/vali-admin), originally created and maintained by its upstream authors.
          The original MIT license is preserved. This mirror is maintained by Amin4601 and does not claim original authorship of the upstream project.
          EOF

      - name: Create clean Git history and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd upstream
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Vali Admin with upstream attribution"
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c http.version=HTTP/1.1 push destination HEAD:main --force
